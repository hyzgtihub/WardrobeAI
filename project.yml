name: YISU
options:
  bundleIdPrefix: com.huyouzhen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: YES
configs:
  Debug: debug
  Release: release
targets:
  YISU:
    type: application
    platform: iOS
    sources:
      - WardrobeApp
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huyouzhen.wardrobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 衣序
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  YISUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WardrobeAppTests
    dependencies:
      - target: YISU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huyouzhen.wardrobe.tests
        GENERATE_INFOPLIST_FILE: YES
  YISUUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WardrobeAppUITests
    dependencies:
      - target: YISU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huyouzhen.wardrobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YISU
schemes:
  YISU:
    build:
      targets:
        YISU: all
        YISUTests: [test]
        YISUUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - YISUTests
        - YISUUITests
